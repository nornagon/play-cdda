name: Republish browser artifacts

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful build run containing bundle-* artifacts
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: publisher
      - name: Prepare sparse publication checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git clone --filter=blob:none --depth=1 --no-checkout --single-branch --branch data \
            "https://github.com/$GITHUB_REPOSITORY.git" site
          git -C site sparse-checkout init --no-cone
          git -C site sparse-checkout set channels.json
          git -C site checkout data
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          path: artifacts
      - uses: actions/github-script@v7
        with:
          script: |
            const { default: publish } = await import('${{ github.workspace }}/publisher/publish.js')
            await publish({ core })
      - name: Push publication data
        working-directory: site
        env:
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse --all
          if git diff --cached --quiet; then
            exit 0
          fi
          DATA_TREE=$(git write-tree)
          DATA_COMMIT=$(git commit-tree "$DATA_TREE" -m "Republish browser artifacts from run $SOURCE_RUN_ID")
          git push --force origin "$DATA_COMMIT:refs/heads/data"
