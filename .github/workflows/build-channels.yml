name: Build browser channel lane

on:
  workflow_call:
    inputs:
      matrix:
        description: JSON build matrix for this cache lane
        required: true
        type: string
      max_parallel:
        description: Maximum concurrent builds in this cache lane
        required: true
        type: number

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max_parallel }}
      matrix: ${{ fromJSON(inputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out publisher
        uses: actions/checkout@v4
        with:
          path: publisher
      - name: Check out Cataclysm-DDA source
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: ${{ matrix.sourceSha }}
          path: cdda
          fetch-depth: 1
      - name: Fetch source release tag
        env:
          SOURCE_SHA: ${{ matrix.sourceSha }}
          SOURCE_TAG: ${{ matrix.tag }}
        run: |
          git -C cdda fetch --depth=1 origin "refs/tags/$SOURCE_TAG:refs/tags/$SOURCE_TAG"
          test "$(git -C cdda rev-parse "$SOURCE_TAG^{commit}")" = "$SOURCE_SHA"
      - name: Import matching precomposed tilesets
        env:
          TILESET_ASSET_URL: ${{ matrix.tilesetAssetUrl }}
        run: |
          mkdir release-graphics
          curl --fail --location --retry 3 "$TILESET_ASSET_URL" --output release-graphics.tar.gz
          tar -xzf release-graphics.tar.gz -C release-graphics --wildcards '*/gfx/*'
          TILESET_ROOT=$(find release-graphics -type d -name gfx -print -quit)
          test -n "$TILESET_ROOT"
          cp -a "$TILESET_ROOT/." cdda/gfx/
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ccache glslang-tools jq ninja-build
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.8
          actions-cache-folder: emsdk-cache
      - name: Warm Emscripten ports
        # A cold parallel build otherwise races multiple em++ processes for
        # Emscripten's single-writer SDL_ttf/Freetype/HarfBuzz port cache.
        env:
          PATCH_FAMILY: ${{ matrix.patchFamily }}
        run: |
          if [ "$PATCH_FAMILY" = experimental ]; then
            embuilder build sdl3_ttf
          else
            embuilder build sdl2_ttf
          fi
      - name: Apply downstream browser patch
        env:
          PATCH_FAMILY: ${{ matrix.patchFamily }}
        run: |
          for patch in "$GITHUB_WORKSPACE/publisher/patches/$PATCH_FAMILY/"*.patch; do
            git -C cdda apply --index "$patch"
          done
      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/ccache
          key: wasm-${{ matrix.patchFamily }}${{ matrix.patchVersion }}-complete-${{ matrix.patchsetId }}-${{ matrix.sourceSha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wasm-${{ matrix.patchFamily }}${{ matrix.patchVersion }}-complete-${{ matrix.patchsetId }}-${{ matrix.sourceSha }}-
            wasm-${{ matrix.patchFamily }}${{ matrix.patchVersion }}-complete-
            wasm-${{ matrix.patchFamily }}${{ matrix.patchVersion }}-partial-${{ matrix.patchsetId }}-${{ matrix.sourceSha }}-
            wasm-${{ matrix.patchFamily }}${{ matrix.patchVersion }}-partial-
      - name: Configure compiler cache
        run: |
          ccache --set-config=cache_dir="$GITHUB_WORKSPACE/.cache/ccache"
          ccache --set-config=compiler_check=content
          ccache --max-size=5G
          ccache --zero-stats
      - id: sdl3-image-cache
        if: matrix.patchFamily == 'experimental'
        uses: actions/cache@v4
        with:
          path: .cache/sdl3-image
          key: sdl3-image-emscripten-6.0.8-3.4.4
      - name: Build SDL3_image
        if: matrix.patchFamily == 'experimental' && steps.sdl3-image-cache.outputs.cache-hit != 'true'
        run: publisher/scripts/build-sdl3-image.sh "$GITHUB_WORKSPACE/.cache/sdl3-image"
      - name: Compile Cataclysm-DDA
        id: compile
        working-directory: cdda
        env:
          BUILD_TARGET: emscripten-objects
          CCACHE: 1
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
          CCACHE_COMPILERCHECK: content
          EMSDK_VERSION: 6.0.8
          EMSCRIPTEN_SDL3_IMAGE_PREFIX: ${{ github.workspace }}/.cache/sdl3-image
        run: ./build-scripts/build-emscripten.sh
      - name: Save complete compiler cache checkpoint
        if: steps.compile.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .cache/ccache
          key: wasm-${{ matrix.patchFamily }}${{ matrix.patchVersion }}-complete-${{ matrix.patchsetId }}-${{ matrix.sourceSha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save partial compiler cache checkpoint
        if: always() && steps.compile.outcome == 'failure'
        uses: actions/cache/save@v4
        with:
          path: .cache/ccache
          key: wasm-${{ matrix.patchFamily }}${{ matrix.patchVersion }}-partial-${{ matrix.patchsetId }}-${{ matrix.sourceSha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Link Cataclysm-DDA
        working-directory: cdda
        env:
          CCACHE: 1
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
          CCACHE_COMPILERCHECK: content
          EMSDK_VERSION: 6.0.8
          EMSCRIPTEN_SDL3_IMAGE_PREFIX: ${{ github.workspace }}/.cache/sdl3-image
        run: ./build-scripts/build-emscripten.sh
      - name: Report compiler cache
        if: always()
        run: ccache --show-stats
      - name: Package browser bundle
        working-directory: cdda
        run: ./build-scripts/prepare-web.sh
      - name: Smoke test browser bundle
        run: node publisher/scripts/smoke-bundle.mjs cdda/build
      - name: Assemble publication artifact
        env:
          CHANNEL: ${{ matrix.channel }}
          VERSION: ${{ matrix.version }}
          TAG: ${{ matrix.tag }}
          SOURCE_SHA: ${{ matrix.sourceSha }}
          PATCHSET: ${{ matrix.patchsetId }}
          UPSTREAM_PUBLISHED_AT: ${{ matrix.publishedAt }}
        run: |
          mkdir artifact
          cp -a cdda/build/. artifact/
          jq -n \
            --arg channel "$CHANNEL" \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg patchset "$PATCHSET" \
            --arg upstreamPublishedAt "$UPSTREAM_PUBLISHED_AT" \
            '{channel: $channel, version: $version, tag: $tag, sourceSha: $sourceSha, patchset: $patchset, upstreamPublishedAt: $upstreamPublishedAt, builtAt: (now | todateiso8601)}' \
            > artifact/build-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.channel }}
          path: artifact
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    # Publish successful artifacts from this lane even when another matrix
    # entry, or the other independently-called lane, failed.
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    concurrency:
      group: play-cdda-data-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          path: publisher
      - name: Prepare sparse publication checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git clone --filter=blob:none --depth=1 --no-checkout --single-branch --branch data \
            "https://github.com/$GITHUB_REPOSITORY.git" site
          git -C site sparse-checkout init --no-cone
          git -C site sparse-checkout set channels.json
          git -C site checkout data
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: actions/github-script@v7
        with:
          script: |
            const { default: publish } = await import('${{ github.workspace }}/publisher/publish.js')
            await publish({ core })
      - name: Push publication data
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse --all
          if git diff --cached --quiet; then
            exit 0
          fi
          DATA_TREE=$(git write-tree)
          DATA_COMMIT=$(git commit-tree "$DATA_TREE" -m "Publish browser builds from run $GITHUB_RUN_ID")
          git push --force origin "$DATA_COMMIT:refs/heads/data"
