name: Build and publish browser channels

on:
  schedule:
    - cron: "40 10 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to check
        type: choice
        options:
          - all
          - stable
          - prerelease
          - experimental
        default: all
      force:
        description: Rebuild even when the channel is current
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: play-cdda-publisher
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      release_matrix: ${{ steps.channels.outputs.release_matrix }}
      experimental_matrix: ${{ steps.channels.outputs.experimental_matrix }}
      has_release_builds: ${{ steps.channels.outputs.has_release_builds }}
      has_experimental_builds: ${{ steps.channels.outputs.has_experimental_builds }}
      has_builds: ${{ steps.channels.outputs.has_builds }}
    steps:
      - uses: actions/checkout@v4
      - id: channels
        uses: actions/github-script@v7
        with:
          script: |
            const { default: discover } = await import('${{ github.workspace }}/discover.js')
            await discover({
              github,
              context,
              core,
              requestedChannel: context.payload.inputs?.channel || 'all',
              force: context.payload.inputs?.force === 'true',
            })

  build-releases:
    needs: discover
    if: needs.discover.outputs.has_release_builds == 'true'
    uses: ./.github/workflows/build-channels.yml
    with:
      matrix: ${{ needs.discover.outputs.release_matrix }}
      max_parallel: 1

  build-experimental:
    needs: discover
    if: needs.discover.outputs.has_experimental_builds == 'true'
    uses: ./.github/workflows/build-channels.yml
    with:
      matrix: ${{ needs.discover.outputs.experimental_matrix }}
      max_parallel: 1

  publish:
    needs: [discover, build-releases, build-experimental]
    # Publish every channel that produced a complete artifact. A failure in one
    # channel leaves its old pointer intact without blocking the other channels.
    if: always() && needs.discover.outputs.has_builds == 'true' && needs.build-releases.result != 'cancelled' && needs.build-experimental.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: publisher
      - name: Prepare sparse publication checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git clone --filter=blob:none --depth=1 --no-checkout --single-branch --branch data \
            "https://github.com/$GITHUB_REPOSITORY.git" site
          git -C site sparse-checkout init --no-cone
          git -C site sparse-checkout set channels.json
          git -C site checkout data
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: actions/github-script@v7
        with:
          script: |
            const { default: publish } = await import('${{ github.workspace }}/publisher/publish.js')
            await publish({ core })
      - name: Push publication data
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse --all
          if git diff --cached --quiet; then
            exit 0
          fi
          DATA_TREE=$(git write-tree)
          DATA_COMMIT=$(git commit-tree "$DATA_TREE" -m "Publish browser builds from run $GITHUB_RUN_ID")
          git push --force origin "$DATA_COMMIT:refs/heads/data"
