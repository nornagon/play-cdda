name: Build and publish browser channels

on:
  schedule:
    - cron: "40 10 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to check
        type: choice
        options:
          - all
          - stable
          - prerelease
          - experimental
        default: all
      force:
        description: Rebuild even when the channel is current
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: play-cdda-publisher
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      release_matrix: ${{ steps.channels.outputs.release_matrix }}
      experimental_matrix: ${{ steps.channels.outputs.experimental_matrix }}
      has_release_builds: ${{ steps.channels.outputs.has_release_builds }}
      has_experimental_builds: ${{ steps.channels.outputs.has_experimental_builds }}
      has_builds: ${{ steps.channels.outputs.has_builds }}
    steps:
      - uses: actions/checkout@v4
      - id: channels
        uses: actions/github-script@v7
        with:
          script: |
            const { default: discover } = await import('${{ github.workspace }}/discover.js')
            await discover({
              github,
              context,
              core,
              requestedChannel: context.payload.inputs?.channel || 'all',
              force: context.payload.inputs?.force === 'true',
            })

  build-releases:
    needs: discover
    if: needs.discover.outputs.has_release_builds == 'true'
    uses: ./.github/workflows/build-channels.yml
    with:
      matrix: ${{ needs.discover.outputs.release_matrix }}
      max_parallel: 1

  build-experimental:
    needs: discover
    if: needs.discover.outputs.has_experimental_builds == 'true'
    uses: ./.github/workflows/build-channels.yml
    with:
      matrix: ${{ needs.discover.outputs.experimental_matrix }}
      max_parallel: 1
